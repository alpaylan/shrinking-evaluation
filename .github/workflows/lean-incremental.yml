name: Lean incremental ground truth

on:
  workflow_dispatch:
    inputs:
      workload:
        description: "Workload short name (matches store.<workload>.det.jsonl)"
        required: true
        default: "rbt"
      per_task_minutes:
        description: "Wall-clock budget per task per run (minutes; max ~340 for free public runner)"
        required: true
        default: "300"
      etna-version:
        description: "etna-cli release tag to install (e.g. v0.1.10). Empty = latest release."
        required: false
        default: ""

# Allow the consolidate job to push back to the repo.
permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      empty:  ${{ steps.list.outputs.empty }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          python3 scripts/lean_pending_tasks.py "${{ inputs.workload }}" > tasks.json
          cat tasks.json
          echo "matrix=$(cat tasks.json)" >> "$GITHUB_OUTPUT"
          if [ "$(jq '.include | length' tasks.json)" = "0" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

  lean:
    needs: discover
    if: needs.discover.outputs.empty == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            workloads/${{ inputs.workload }}-haskell/.stack-work
          key: stack-${{ runner.os }}-${{ inputs.workload }}-${{ hashFiles(format('workloads/{0}-haskell/**/stack.yaml*', inputs.workload), format('workloads/{0}-haskell/**/*.cabal', inputs.workload)) }}
          restore-keys: |
            stack-${{ runner.os }}-${{ inputs.workload }}-

      # Pattern lifted from alpaylan/etna-cli's run-and-publish.yml: pull
      # the etna-installer.sh from the chosen release tag, drop the binary
      # into ~/.cargo/bin, and append that to PATH.
      - name: Install etna-cli
        shell: bash
        run: |
          if [ -n "${{ inputs.etna-version }}" ]; then
            url="https://github.com/alpaylan/etna-cli/releases/download/${{ inputs.etna-version }}/etna-installer.sh"
          else
            url="https://github.com/alpaylan/etna-cli/releases/latest/download/etna-installer.sh"
          fi
          curl -LsSf "$url" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/etna" --version || true

      # The per-workload upstream repos declare etna-lib as a
      # submodule with a `git@github.com:` URL. CI runners don't carry
      # SSH keys, so rewrite all `git@github.com:` URLs to https://
      # globally before any submodule clone runs.
      - name: Rewrite SSH submodule URLs to HTTPS
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      # etna requires a global config + an experiment dir before
      # `experiment run` works. Mirror the alpaylan/etna-cli reference
      # workflow: setup config, create the experiment, then clone the
      # canonical per-workload repo (alpaylan/etna-haskell-<wl>) which
      # is what `etna workload add` expects — workload-shaped repo
      # with etna.toml + steps.json at its root. The LeanCheck
      # streaming rewrite + shrink-counter schema live on the main
      # branches of those upstream repos.
      - name: Setup etna config + experiment + workload
        id: etna
        shell: bash
        run: |
          etna setup --overwrite || true
          mkdir -p /tmp/etna-experiment
          cd /tmp/etna-experiment
          etna experiment new ci-run
          cd ci-run
          etna workload add "https://github.com/alpaylan/etna-haskell-${{ inputs.workload }}.git"
          echo "exp_dir=/tmp/etna-experiment/ci-run" >> "$GITHUB_OUTPUT"
          ls tests/ | head

      - name: Compose single-task test JSON
        id: task
        run: |
          MUT="${{ matrix.mutation }}"
          PROP="${{ matrix.property }}"
          # Reserve 90s of the runner budget for setup/teardown.
          BUDGET=$(( ${{ inputs.per_task_minutes }} * 60 - 90 ))
          NAME="lean-${{ inputs.workload }}-${MUT}-${PROP}"
          python3 scripts/lean_compose_task.py \
            --workload "${{ inputs.workload }}" \
            --mutation "$MUT" --property "$PROP" \
            --timeout "$BUDGET" --out-name "$NAME"
          # etna looks up <name>.json in the experiment's tests/ dir,
          # which `etna workload add` populated from the repo. Drop the
          # composed JSON in alongside.
          cp "tests/${NAME}.json" "${{ steps.etna.outputs.exp_dir }}/tests/"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # State persistence via Cloudflare R2 (S3-compatible). The aws
      # CLI is preinstalled on ubuntu-latest. Each task has a fixed
      # object path so puts overwrite cleanly and no key juggling is
      # required (unlike GH Actions Cache where keys are immutable).
      - name: Restore Lean state from R2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto
          R2_ENDPOINT:           https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET:             ${{ secrets.R2_BUCKET }}
          MUT:                   ${{ matrix.mutation }}
          PROP:                  ${{ matrix.property }}
          WL:                    ${{ inputs.workload }}
        run: |
          CKPT_REL="state/lean/${WL}/${MUT}_${PROP}.txt"
          STORE_REL="partial-stores/lean-${WL}-${MUT}-${PROP}.jsonl"
          mkdir -p "$(dirname "$CKPT_REL")" partial-stores
          aws s3 cp --endpoint-url "$R2_ENDPOINT" --quiet \
            "s3://$R2_BUCKET/$CKPT_REL" "$CKPT_REL" 2>/dev/null || true
          aws s3 cp --endpoint-url "$R2_ENDPOINT" --quiet \
            "s3://$R2_BUCKET/$STORE_REL" "$STORE_REL" 2>/dev/null || true
          if [ -f "$CKPT_REL" ]; then
            echo "Restored offset $(cat "$CKPT_REL")"
          else
            echo "No prior state — starting from index 0"
          fi

      - name: Read prior checkpoint
        id: ckpt
        run: |
          CKPT="$GITHUB_WORKSPACE/state/lean/${{ inputs.workload }}/${{ matrix.mutation }}_${{ matrix.property }}.txt"
          mkdir -p "$(dirname "$CKPT")"
          if [ -f "$CKPT" ]; then VAL=$(cat "$CKPT"); else VAL=0; fi
          echo "resume=$VAL"   >> "$GITHUB_OUTPUT"
          echo "path=$CKPT"    >> "$GITHUB_OUTPUT"
          echo "Resuming from index $VAL"

      # Run etna in the background. A bash watchdog pushes the latest
      # checkpoint + partial store to R2 every 60s. R2 is append-only-
      # for-our-purposes (we PUT the same key repeatedly, latest wins)
      # and survives any SIGTERM since each write is a single HTTP
      # round-trip — completes within seconds, before the runner's
      # grace period expires.
      - name: Run incremental Lean (with mid-run R2 saves)
        env:
          ETNA_LEAN_RESUME:      ${{ steps.ckpt.outputs.resume }}
          ETNA_LEAN_CHECKPOINT:  ${{ steps.ckpt.outputs.path }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto
          R2_ENDPOINT:           https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET:             ${{ secrets.R2_BUCKET }}
          MUT:                   ${{ matrix.mutation }}
          PROP:                  ${{ matrix.property }}
          WL:                    ${{ inputs.workload }}
        run: |
          set +e
          STORE_REL="partial-stores/lean-${WL}-${MUT}-${PROP}.jsonl"
          CKPT_REL="state/lean/${WL}/${MUT}_${PROP}.txt"
          STORE="$GITHUB_WORKSPACE/$STORE_REL"
          mkdir -p "$GITHUB_WORKSPACE/partial-stores"

          # Helper: push current state to R2.
          push_state() {
            if [ -f "$ETNA_LEAN_CHECKPOINT" ]; then
              aws s3 cp --endpoint-url "$R2_ENDPOINT" --quiet \
                "$ETNA_LEAN_CHECKPOINT" "s3://$R2_BUCKET/$CKPT_REL" \
                || echo "::warning::R2 put failed (checkpoint)"
            fi
            if [ -f "$STORE" ] && [ -s "$STORE" ]; then
              aws s3 cp --endpoint-url "$R2_ENDPOINT" --quiet \
                "$STORE" "s3://$R2_BUCKET/$STORE_REL" \
                || echo "::warning::R2 put failed (store)"
            fi
          }

          cd "${{ steps.etna.outputs.exp_dir }}"
          etna experiment run \
            --tests "${{ steps.task.outputs.name }}" \
            --store "$STORE" \
            --short-circuit &
          ETNA_PID=$!

          LAST=""
          while kill -0 "$ETNA_PID" 2>/dev/null; do
            sleep 60
            if [ -f "$ETNA_LEAN_CHECKPOINT" ]; then
              CUR=$(cat "$ETNA_LEAN_CHECKPOINT" 2>/dev/null || echo "")
              if [ -n "$CUR" ] && [ "$CUR" != "$LAST" ]; then
                push_state
                LAST="$CUR"
                echo "[$(date +%H:%M:%S)] saved offset $CUR to R2"
              fi
            fi
          done

          wait "$ETNA_PID" || true
          # Final flush after etna exits cleanly.
          push_state

          echo "--- store rows produced ---"
          wc -l "$STORE" || true

  # Consolidate is intentionally a no-op in this workflow now: per-task
  # state lives in GH Actions Cache (saved mid-run by the watchdog so
  # spot reclamation doesn't lose it). To merge cached partial stores
  # into the master `store.<wl>.det.jsonl` and commit, run
  # `scripts/lean_pull_caches.py` locally; that script lists the
  # `lean-state-<wl>-*` caches via the GH REST API and reassembles
  # state without going through Actions.
  summary:
    needs: lean
    if: always() && needs.discover.outputs.empty == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Summarise lean matrix outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --paginate \
            --jq '.jobs[] | select(.name | startswith("lean")) | "\(.conclusion // "?")  \(.name)"' \
            | sort | uniq -c | sort -rn || true
